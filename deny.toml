[advisories]
version = 2
# Plotters' pure-Rust embedded-font backend currently depends on ab_glyph,
# which depends on ttf-parser. RUSTSEC-2026-0192 reports that ttf-parser is
# unmaintained and explicitly notes that no safe upgrade is available. Keep
# the exception narrow and revisit it when Plotters adopts skrifa/fontations.
ignore = ["RUSTSEC-2026-0192"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
