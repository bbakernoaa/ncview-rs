[advisories]
version = 2
ignore = [
    # RUSTSEC-2026-0459: bundled C SQLite page-cache disclosure (CVE-2026-119375).
    # The patched libsqlite3-sys 0.39 is unreachable today: grib (even 0.21)
    # requires proj ^0.31 -> proj-sys ^0.27 -> libsqlite3-sys <0.36, and
    # proj-sys is a `links` crate so versions cannot coexist. Exposure is
    # limited: the attack needs the victim to open an attacker-crafted
    # database + `-wal` pair; ncv only opens PROJ's own proj.db, and native
    # builds link the system SQLite rather than the bundled copy. Revisit
    # when grib adopts proj 0.32 (proj-sys 0.28 allows libsqlite3-sys 0.39).
    "RUSTSEC-2026-0459",
    # RUSTSEC-2026-0543: chrono is unmaintained with no safe upgrade available.
    # It is required transitively by grib and object_store as well as
    # directly, so it cannot be dropped until those crates migrate (jiff/time).
    "RUSTSEC-2026-0543",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
