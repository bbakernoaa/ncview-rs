name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: ncv-linux-x86_64.tar.gz
          - name: Linux x86_64 (musl, static)
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: ncv-linux-x86_64-musl.tar.gz
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: ncv-macos-aarch64.tar.gz
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: ncv-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: matrix.target != 'x86_64-unknown-linux-musl'
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: Install PROJ build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          & (Join-Path $vcpkgRoot 'vcpkg.exe') install 'sqlite3[core,tool]:x64-windows-static'
          $installedDir = Join-Path $vcpkgRoot 'installed/x64-windows-static'
          $sqliteExe = Get-ChildItem -Path $installedDir -Filter sqlite3.exe -Recurse | Select-Object -First 1
          if (-not $sqliteExe) { throw 'vcpkg did not provide the sqlite3 executable required by PROJ' }
          $sqliteExe.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $sqliteLib = Get-ChildItem -Path $installedDir -Filter sqlite3.lib -Recurse | Select-Object -First 1
          if ($sqliteLib) {
            "SQLite3_LIBRARY=$($sqliteLib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "LIB=$($sqliteLib.Directory.FullName);$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          $sqliteInc = Get-ChildItem -Path $installedDir -Filter sqlite3.h -Recurse | Select-Object -First 1
          if ($sqliteInc) { "SQLite3_INCLUDE_DIR=$($sqliteInc.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          "CMAKE_PREFIX_PATH=$installedDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SQLite3_ROOT=$installedDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_TARGET_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_TOOLCHAIN_FILE=$(Join-Path $vcpkgRoot 'scripts/buildsystems/vcpkg.cmake')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build standard target
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Build static musl target
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            rust:alpine \
            sh -euxc '\
              apk add --no-cache build-base cmake perl sqlite && \
              rustup target add x86_64-unknown-linux-musl && \
              export CC_x86_64_unknown_linux_musl=gcc CXX_x86_64_unknown_linux_musl=g++ && \
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=gcc && \
              export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-static -C link-arg=-static-libstdc++ -C link-arg=-static-libgcc" && \
              cargo build --locked --release --jobs 2 --target x86_64-unknown-linux-musl'
      - name: Verify static musl binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/ncv"
          file_output="$(file "$binary")"
          printf '%s\n' "$file_output"
          if [[ "$file_output" != *"statically linked"* && "$file_output" != *"static-pie linked"* ]]; then
            exit 1
          fi
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="staging/ncv"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/ncv" "$staging/ncv"
          tar -C staging -czf "${{ matrix.archive }}" ncv
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging/ncv
          cp "target/${{ matrix.target }}/release/ncv.exe" staging/ncv/ncv.exe
          7z a "${{ matrix.archive }}" staging/ncv/ncv.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the floating `latest` tag can be moved and pushed.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          # Keep GitHub's "Latest" badge on the numbered release so the
          # floating `latest` tag never competes with it.
          make_latest: true
      # Re-point the floating `latest` tag at this release commit. The tag is
      # pushed by the bot (not a `v*` tag) so it does not re-trigger this
      # workflow, and force-pushing lets it move forward on every release.
      - name: Move floating latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a latest -m "Latest release (${{ github.ref_name }})"
          git push -f origin latest
      - name: Publish floating latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest release"
          body: |
            Rolling release that always points at the newest published build
            (currently ${{ github.ref_name }}). Use the versioned tag for
            reproducible installs; use this one when you always want the most
            recent binary. Stable download path:
            `https://github.com/${{ github.repository }}/releases/download/latest/<asset>`.
          files: dist/*
          # Replace the previous floating assets in place rather than erroring.
          overwrite_files: true
          make_latest: false
          prerelease: false
