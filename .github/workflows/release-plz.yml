name: Release-plz

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # Inspect commits merged since the last release. If anything is unreleased,
  # open (or update) a "chore: release X.Y.Z" pull request that bumps
  # Cargo.toml and CHANGELOG.md according to Conventional Commits.
  release-pr:
    name: Open release PR
    runs-on: ubuntu-latest
    # Skip on forks so PRs aren't opened against the wrong repository.
    if: github.repository_owner == 'bbakernoaa'
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz (release PR)
        id: release_plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `main` has no branch protection here, so the release PR is mergeable
      # the moment it is opened. Merge it straight away to complete the
      # hands-off chain: the merge commit lands on main, which re-triggers this
      # workflow, and the `release` job then tags it.
      #
      # The merge MUST use the PAT (not GITHUB_TOKEN): GitHub never runs a
      # workflow for a push made by GITHUB_TOKEN, so a GITHUB_TOKEN merge would
      # leave the release commit sitting on main with no tag ever created.
      - name: Auto-merge the release PR
        if: steps.release_plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PR_JSON: ${{ steps.release_plz.outputs.pr }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_PLZ_TOKEN secret is not set; cannot auto-merge."
            echo "The release PR was opened but will need a manual merge."
            exit 1
          fi
          pr_url=$(printf '%s' "$PR_JSON" | jq -r '.html_url // empty')
          if [ -z "$pr_url" ]; then
            echo "No release PR URL in output; skipping auto-merge." >&2
            exit 0
          fi
          gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

  # When the release PR is merged, create the `vX.Y.Z` tag. The tag push then
  # triggers release.yml, which builds and publishes the binaries. No
  # crates.io token is needed because the package runs in git-only mode.
  release:
    name: Tag release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'bbakernoaa'
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz (release)
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # The action passes GITHUB_TOKEN to `release-plz release --git-token`,
          # which is what pushes the `vX.Y.Z` tag. GitHub never runs a workflow
          # in response to an event caused by the default GITHUB_TOKEN, so a
          # tag pushed with it would silently fail to trigger release.yml.
          # Supply a fine-grained PAT (read/write "Contents" on this repo) as
          # the RELEASE_PLZ_TOKEN secret so the tag push chains into the build.
          # Falls back to GITHUB_TOKEN when the secret is unset (the tag is
          # still created, but release.yml must be run manually).
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
