name: Inspect public ModelE sample
on: [push, pull_request]
permissions:
  contents: read
jobs:
  inspect-model-e:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and inspect sample
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq netcdf-bin
          curl --fail --location --retry 2 --max-time 120 -o /tmp/modele.nc https://data.giss.nasa.gov/modelE/greenland-smb/data/ANN.0002-0011.E2-control.nc
          ncdump -k /tmp/modele.nc
          ncdump -h /tmp/modele.nc
