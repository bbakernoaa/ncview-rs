[package]
name = "ncview-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Terminal-native NetCDF scientific data viewer"

[patch.crates-io]
# Fixes HDF5 v2 continuation headers that carry creation-order fields. The
# upstream parser otherwise shifts datatype bodies by two bytes in common
# libnetcdf-generated COARDS files.
oxih5-format = { path = "vendor/oxih5-format" }

[[bin]]
name = "ncv"
path = "src/main.rs"

[dependencies]
base64-simd = "0.8"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
colorous = "1.0.16"
human-panic = "2.0"
crossterm = "0.29"
grib = { version = "0.18.4", default-features = false, features = ["jpeg2000-unpack-with-hayro", "png-unpack-with-png-crate", "ccsds-unpack-with-rust-aec", "gridpoints-proj", "time-calculation"] }
image = { version = "0.25.10", default-features = false }
kiddo = { version = "6.3", default-features = false }
ndarray = "0.17.2"
oxinetcdf = "0.1"
plotters = { version = "0.3.7", default-features = false, features = ["ab_glyph", "bitmap_backend", "line_series", "point_series"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }
rayon = "1.12"
serde_json = "1"
thiserror = "2"
tiny-skia = "0.11"

[dev-dependencies]
criterion = "0.8"
proptest = "1"
tempfile = "3"

[build-dependencies]
serde_json = "1"

[[bench]]
name = "interactive_paths"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
